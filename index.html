*, *::before, *::after { box-sizing: border-box; }

html { background: var(--night-bottom); -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--ink);
  font-family: var(--sans);
  background-color: var(--night-bottom);
  background-image:
    radial-gradient(ellipse 90% 40% at 50% 0%, rgba(40, 62, 120, 0.30), transparent 75%),
    linear-gradient(180deg, var(--night-top) 0%, var(--night-mid) 45%, var(--night-bottom) 100%);
  background-repeat: no-repeat;
}

.page {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 430px;
  margin: 0 auto;
  padding: 0 24px calc(52px + env(safe-area-inset-bottom));
  text-align: center;
}

/* ---------- Foto: primer 40% de la pantalla ---------- */
.hero__photo {
  position: relative;
  height: 40vh;
  height: 40svh;
  min-height: 280px;
  margin: 0 -24px;
  overflow: hidden;
  background-color: #0a0f1e;
  background-image: var(--foto-url);
  background-size: cover;
  background-position: var(--foto-pos);
  background-repeat: no-repeat;
  animation: fade 1.2s ease both;
}

.hero__photo::after {
  content: "";
  position: absolute;
  inset: auto 0 0 0;
  height: 15%;
  background: linear-gradient(to bottom, rgba(4, 6, 13, 0), var(--night-mid));
  pointer-events: none;
}

/* ---------- Nombre ---------- */
.hero__text {
  position: relative;
  z-index: 1;
  margin-top: -34px;
}

.name {

}

.divider {
  width: 66%;
  height: 1px;
  margin: 34px auto;
  border: 0;
  background: linear-gradient(90deg, transparent, var(--champagne-dim), transparent);
}

/* ---------- Tarjetas ---------- */
.cards { display: grid; gap: 18px; }

.card {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 68px;
  padding: 14px 56px;
  text-decoration: none;
  color: var(--ink);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
  border: 1px solid rgba(214, 189, 147, 0.22);
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  transition: transform 0.25s ease, border-color 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
  -webkit-tap-highlight-color: transparent;
  animation: rise 0.9s ease both;
}

.card:nth-child(1) { animation-delay: 0.8s; }
.card:nth-child(2) { animation-delay: 0.95s; }
.card:nth-child(3) { animation-delay: 1.1s; }

.card__icon {
  position: absolute;
  left: 22px;
  top: 50%;
  width: 24px;
  height: 24px;
  margin-top: -12px;
  color: var(--champagne);
}

.card__text { display: block; }

.card__title {
  display: block;
  font-family: var(--serif);
  font-size: 1rem;
  letter-spacing: 0.16em;
  line-height: 1.25;
}

.card__sub {
  display: block;
  margin-top: 5px;
  font-size: 0.8rem;
  letter-spacing: 0.03em;
  color: var(--ink-soft);
}

/* ---------- Tarjeta principal (OnlyFans) ---------- */
.card--main {
  min-height: 100px;
  padding: 20px 22px 20px 72px;
  border-radius: 22px;
  border-color: rgba(214, 189, 147, 0.7);
  background:
    radial-gradient(ellipse 90% 130% at 50% 0%, rgba(214, 189, 147, 0.24), transparent 70%),
    linear-gradient(180deg, rgba(214, 189, 147, 0.13), rgba(214, 189, 147, 0.04));
  box-shadow: 0 14px 38px rgba(0, 0, 0, 0.5), 0 0 40px rgba(214, 189, 147, 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}

.card--main .card__icon {
  left: 20px;
  width: 42px;
  height: 42px;
  margin-top: -21px;
  padding: 10px;
  border: 1px solid rgba(214, 189, 147, 0.55);
  border-radius: 50%;
  background: rgba(214, 189, 147, 0.08);
}

.card--main .card__title { font-size: 1.04rem; letter-spacing: 0.13em; }
.card--main .card__sub { font-size: 0.8rem; color: var(--ink); opacity: 0.8; }

.card:hover,
.card:active {
  transform: translateY(-2px);
  border-color: rgba(214, 189, 147, 0.72);
  background-color: rgba(214, 189, 147, 0.06);
}

.card--main:hover,
.card--main:active {
  border-color: var(--champagne);
  box-shadow: 0 16px 42px rgba(0, 0, 0, 0.55), 0 0 50px rgba(214, 189, 147, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.1);
}

.card:focus-visible { outline: 2px solid var(--champagne); outline-offset: 3px; }

.footer {
  margin-top: 72px;
  font-size: 0.76rem;
  letter-spacing: 0.1em;
  color: var(--muted);
  animation: fade 1.1s ease 1.25s both;
}

/* ---------- Animaciones ---------- */
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}

@media (max-width: 380px) {
  .card--main .card__title { font-size: 0.94rem; letter-spacing: 0.09em; }
  .card--main .card__sub { font-size: 0.74rem; letter-spacing: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .hero__photo, .name, .handle, .welcome, .card, .footer { animation: none; }
  .card { transition: none; }
}
