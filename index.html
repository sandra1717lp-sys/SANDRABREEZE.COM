<style>
  :root {
    --bg: #e4dbfb;
    --bg-2: #f7dcea;
    --card: rgba(255,255,255,.68);
    --card-border: rgba(130,110,210,.28);
    --text: #1f1836;
    --muted: #6d6488;
    --accent: #9b8cf0;
    --accent-2: #f08fbb;
    --online: #2fcf7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100vh;
    font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, #d9cffb 0%, #f3d8ec 55%, #fdf1f6 100%);
    background-attachment: fixed;
    padding: max(28px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 440px; text-align: center; }

  /* Avatar */
  .avatar-wrap { position: relative; width: 112px; height: 112px; margin: 8px auto 14px; }
  .avatar {
    width: 100%; height: 100%; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)) center/cover;
    background-image: url('avatar.jpeg'), linear-gradient(135deg, var(--accent), var(--accent-2));
    background-size: cover; background-position: center;
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 3px var(--accent-2);
  }
  .dot {
    position: absolute; right: 6px; bottom: 6px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--online); border: 3px solid var(--bg);
  }

  h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -.01em; }
  .status { margin-top: 4px; font-size: .92rem; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--online); display: inline-block; }

    border: 2px solid rgba(255,255,255,.85);
    text-decoration: none; color: #fff;
    box-shadow: 0 10px 30px rgba(120,90,200,.25);
    cursor: pointer;
  }
  .hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(31,24,54,.7) 0%, rgba(31,24,54,0) 45%);
  }
  .hero span {
    position: absolute; left: 0; right: 0; bottom: 20px; z-index: 1;
    font-size: 1.3rem; font-weight: 600;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
  }

  /* Botones de links */
  .links { display: grid; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border-radius: 20px;
    background: var(--card); border: 1px solid var(--card-border);
    color: var(--text); text-decoration: none; text-align: left;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: transform .15s ease, background .15s ease;
    cursor: pointer;
  }
  .link:hover { background: rgba(255,255,255,.95); transform: translateY(-1px); }
  .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .link.main {
    background: linear-gradient(135deg, #17121f 0%, #3b2f6b 100%);
    border-color: transparent; color: #fff;
  }
  .badge {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(155,140,240,.2);
  }
  .link.main .badge { background: rgba(255,255,255,.16); }
  .badge svg { width: 22px; height: 22px; fill: currentColor; }
  .link strong { display: block; font-size: 1rem; font-weight: 600; }
  .link small { display: block; font-size: .8rem; opacity: .75; margin-top: 1px; }

  footer { margin-top: 28px; font-size: .78rem; color: var(--muted); }

  /* Luz que recorre el marco de la foto principal */
  @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes spin-light { to { --angle: 360deg; } }
  .hero-wrap { position: relative; margin: 24px 0 14px; border-radius: 24px; isolation: isolate; }
  .hero-wrap::before,
  .hero-wrap::after {
    content: ''; position: absolute; inset: -6px; border-radius: 29px; z-index: 0;
    background: conic-gradient(from var(--angle),
      rgba(155,140,240,.35) 0deg,
      transparent 90deg,
      rgba(155,140,240,.9) 170deg,
      #a78bff 220deg, #ff5fa2 290deg, #ffffff 335deg, #ffffff 350deg,
      rgba(155,140,240,.35) 360deg);
    animation: spin-light 3.2s linear infinite;
  }
  .hero-wrap::after { inset: -10px; border-radius: 33px; filter: blur(20px) saturate(1.4) brightness(1.25); opacity: 1; }
  .hero-wrap { box-shadow: 0 0 40px rgba(240,143,187,.45), 0 0 90px rgba(155,140,240,.35); }

  /* Corazones flotando al fondo */
  .hearts { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .heart {
    position: absolute; bottom: -60px;
    opacity: 0;
    animation: float-up linear infinite;
    filter: drop-shadow(0 2px 6px rgba(240,143,187,.35));
  }
  @keyframes float-up {
    0%   { transform: translateY(0) translateX(0) rotate(0deg) scale(.8); opacity: 0; }
    10%  { opacity: .85; }
    50%  { transform: translateY(-55vh) translateX(18px) rotate(12deg) scale(1); }
    90%  { opacity: .6; }
    100% { transform: translateY(-115vh) translateX(-14px) rotate(-10deg) scale(1.1); opacity: 0; }
  }
  main { position: relative; z-index: 1; }

  @media (prefers-reduced-motion: reduce) { .link { transition: none; } .hearts { display: none; } .hero-wrap::before, .hero-wrap::after { animation: none; } }

  /* Verificación de edad */
  .age-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(20,14,40,.72);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    z-index: 999;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .age-overlay.active { display: flex; }
  .age-box {
    background: #fff;
    border-radius: 22px;
    padding: 30px 24px;
    max-width: 340px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(60,40,110,.35);
  }
  .age-box .lock-icon {
    width: 48px; height: 48px; margin: 0 auto 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
  }
  .age-box .lock-icon svg { width: 22px; height: 22px; fill: #fff; }
  .age-box h3 { font-size: 1.1rem; margin-bottom: 8px; }
  .age-box p { font-size: .85rem; color: var(--muted); margin-bottom: 20px; line-height: 1.4; }
  .age-buttons { display: flex; gap: 10px; }
  .age-buttons button {
    flex: 1; padding: 12px; border-radius: 14px; border: none;
    font-family: inherit; font-weight: 600; font-size: .9rem; cursor: pointer;
  }
  .btn-back { background: #f1eefc; color: var(--text); }
  .btn-continue {
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff;
  }
</style>
</head>
