<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sandra Breeze</title>
<meta name="description" content="Mis links oficiales">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e4dbfb;
    --bg-2: #f7dcea;
    --card: rgba(255,255,255,.68);
    --card-border: rgba(130,110,210,.28);
    --text: #1f1836;
    --muted: #6d6488;
    --accent: #9b8cf0;
    --accent-2: #f08fbb;
    --online: #2fcf7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100vh;
    font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--text);
    background: linear-gradient(180deg, #d9cffb 0%, #f3d8ec 55%, #fdf1f6 100%);
    background-attachment: fixed;
    padding: max(28px, env(safe-area-inset-top)) 18px max(32px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 440px; text-align: center; }

  /* Avatar */
  .avatar-wrap { position: relative; width: 112px; height: 112px; margin: 8px auto 14px; }
  .avatar {
    width: 100%; height: 100%; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)) center/cover;
    background-image: url('avatar.jpeg'), linear-gradient(135deg, var(--accent), var(--accent-2));
    background-size: cover; background-position: center;
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 3px var(--accent-2);
  }
  .dot {
    position: absolute; right: 6px; bottom: 6px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--online); border: 3px solid var(--bg);
  }

  h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -.01em; }
  .status { margin-top: 4px; font-size: .92rem; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--online); display: inline-block; }

  /* Foto principal con texto encima */
  .hero {
    position: relative; display: block; z-index: 1;
    aspect-ratio: 4 / 5; border-radius: 22px; overflow: hidden;
    background: linear-gradient(160deg, #b9a9f5, #f2b6d3);
    background-image: url('foto-principal.jpeg'), linear-gradient(160deg, #b9a9f5, #f2b6d3);
    background-size: cover; background-position: center 15%;
    border: 2px solid rgba(255,255,255,.85);
    text-decoration: none; color: #fff;
    box-shadow: 0 10px 30px rgba(120,90,200,.25);
  }
  .hero::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(31,24,54,.7) 0%, rgba(31,24,54,0) 45%);
  }
  .hero span {
    position: absolute; left: 0; right: 0; bottom: 20px; z-index: 1;
    font-size: 1.3rem; font-weight: 600;
    text-shadow: 0 2px 10px rgba(0,0,0,.5);
  }

  /* Botones de links */
  .links { display: grid; gap: 12px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px; border-radius: 20px;
    background: var(--card); border: 1px solid var(--card-border);
    color: var(--text); text-decoration: none; text-align: left;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: transform .15s ease, background .15s ease;
  }
  .link:hover { background: rgba(255,255,255,.95); transform: translateY(-1px); }
  .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .link.main {
    background: linear-gradient(135deg, #17121f 0%, #3b2f6b 100%);
    border-color: transparent; color: #fff;
  }
  .badge {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(155,140,240,.2);
  }
  .link.main .badge { background: rgba(255,255,255,.16); }
  .badge svg { width: 22px; height: 22px; fill: currentColor; }
  .link strong { display: block; font-size: 1rem; font-weight: 600; }
  .link small { display: block; font-size: .8rem; opacity: .75; margin-top: 1px; }

  footer { margin-top: 28px; font-size: .78rem; color: var(--muted); }

  /* Luz que recorre el marco de la foto principal */
  @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
  @keyframes spin-light { to { --angle: 360deg; } }
  .hero-wrap { position: relative; margin: 24px 0 14px; border-radius: 24px; isolation: isolate; }
  .hero-wrap::before,
  .hero-wrap::after {
    content: ''; position: absolute; inset: -6px; border-radius: 29px; z-index: 0;
    background: conic-gradient(from var(--angle),
      rgba(155,140,240,.35) 0deg,
      transparent 90deg,
      rgba(155,140,240,.9) 170deg,
      #a78bff 220deg, #ff5fa2 290deg, #ffffff 335deg, #ffffff 350deg,
      rgba(155,140,240,.35) 360deg);
    animation: spin-light 3.2s linear infinite;
  }
  .hero-wrap::after { inset: -10px; border-radius: 33px; filter: blur(20px) saturate(1.4) brightness(1.25); opacity: 1; }
  .hero-wrap { box-shadow: 0 0 40px rgba(240,143,187,.45), 0 0 90px rgba(155,140,240,.35); }

  /* Corazones flotando al fondo */
  .hearts { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .heart {
    position: absolute; bottom: -60px;
    opacity: 0;
    animation: float-up linear infinite;
    filter: drop-shadow(0 2px 6px rgba(240,143,187,.35));
  }
  @keyframes float-up {
    0%   { transform: translateY(0) translateX(0) rotate(0deg) scale(.8); opacity: 0; }
    10%  { opacity: .85; }
    50%  { transform: translateY(-55vh) translateX(18px) rotate(12deg) scale(1); }
    90%  { opacity: .6; }
    100% { transform: translateY(-115vh) translateX(-14px) rotate(-10deg) scale(1.1); opacity: 0; }
  }
  main { position: relative; z-index: 1; }

  @media (prefers-reduced-motion: reduce) { .link { transition: none; } .hearts { display: none; } .hero-wrap::before, .hero-wrap::after { animation: none; } }
</style>
</head>
<body>
<div class="hearts" id="hearts" aria-hidden="true"></div>
<main>
  <div class="avatar-wrap">
    <div class="avatar" role="img" aria-label="Foto de Sandra Breeze"></div>
    <span class="dot" aria-hidden="true"></span>
  </div>

  <h1>Sandra Breeze</h1>
  <p class="status"><i aria-hidden="true"></i> disponible</p>

  <!-- Foto principal: foto-principal.jpeg -->
  <div class="hero-wrap">
    <a class="hero" href="https://onlyfans.com/sandrabrezeofficial/c11" target="_blank" rel="noopener" aria-label="Dónde más publico">
      <span>dónde más publico</span>
    </a>
  </div>

  <nav class="links" aria-label="Mis links">
    <!-- Falta poner el link en "Más links" (href="#") -->
    <a class="link main" href="https://onlyfans.com/sandrabrezeofficial/c11" target="_blank" rel="noopener">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.6 5 6 5c2 0 3.3 1 4 2.2h4C14.7 6 16 5 18 5c3.4 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z"/></svg>
      </span>
      <span><strong>Mi contenido</strong><small>Mi página principal</small></span>
    </a>

    <a class="link" href="https://www.instagram.com/real.sandrabreeze/" target="_blank" rel="noopener">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5A4.5 4.5 0 1 1 7.5 12 4.5 4.5 0 0 1 12 7.5zm0 2A2.5 2.5 0 1 0 14.5 12 2.5 2.5 0 0 0 12 9.5zM17.3 6a1.1 1.1 0 1 1-1.1 1.1A1.1 1.1 0 0 1 17.3 6z"/></svg>
      </span>
      <span><strong>Instagram</strong><small>Outfits y día a día</small></span>
    </a>

    <a class="link" href="https://www.tiktok.com/@sandrabreeze0" target="_blank" rel="noopener">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M16.6 2h-3.2v13.1a2.9 2.9 0 1 1-2.9-2.9c.3 0 .6 0 .9.1V9a6.1 6.1 0 1 0 5.2 6V8.6a7.6 7.6 0 0 0 4.4 1.4V6.8a4.4 4.4 0 0 1-4.4-4.8z"/></svg>
      </span>
      <span><strong>TikTok</strong><small>Outfit inspo y transiciones</small></span>
    </a>

    <a class="link" href="#">
      <span class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M10.6 13.4a1 1 0 0 1 0-1.4l3-3a3.5 3.5 0 0 1 5 5l-2 2a1 1 0 0 1-1.4-1.4l2-2a1.5 1.5 0 0 0-2.2-2.2l-3 3a1 1 0 0 1-1.4 0zm2.8-2.8a1 1 0 0 1 0 1.4l-3 3a3.5 3.5 0 0 1-5-5l2-2A1 1 0 0 1 8.8 9.4l-2 2a1.5 1.5 0 0 0 2.2 2.2l3-3a1 1 0 0 1 1.4 0z"/></svg>
      </span>
      <span><strong>Más links</strong><small>Todo en un solo lugar</small></span>
    </a>
  </nav>

  <footer>© 2026 Sandra Breeze</footer>
</main>

<script>
(function () {
  var box = document.getElementById('hearts');
  if (!box || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var colors = ['#f08fbb', '#f7b3d0', '#c9b8f5', '#ffffff', '#ff7fae'];
  var svg = function (c) {
    return '<svg viewBox="0 0 24 24" width="100%" height="100%"><path fill="' + c +
      '" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.6 5 6 5c2 0 3.3 1 4 2.2h4C14.7 6 16 5 18 5c3.4 0 5.1 3.4 3.6 6.8C19.5 16.4 12 21 12 21z"/></svg>';
  };
  for (var i = 0; i < 16; i++) {
    var h = document.createElement('span');
    var size = 14 + Math.random() * 26;
    h.className = 'heart';
    h.style.width = h.style.height = size + 'px';
    h.style.left = (Math.random() * 96) + '%';
    h.style.animationDuration = (9 + Math.random() * 9) + 's';
    h.style.animationDelay = (-Math.random() * 14) + 's';
    h.innerHTML = svg(colors[Math.floor(Math.random() * colors.length)]);
    box.appendChild(h);
  }
})();
</script>
</body>
</html>
